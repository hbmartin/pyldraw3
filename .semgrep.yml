rules:
  - id: pyldraw-unsafe-archive-extractall
    languages:
      - python
    severity: ERROR
    paths:
      include:
        - /ldraw/downloads.py
    message: Validate archive member paths before calling extractall().
    patterns:
      - pattern: $ARCHIVE.extractall(...)
      - pattern-not-inside: |
          _validate_zip_members($ARCHIVE, ...)
          ...
          $ARCHIVE.extractall(...)

  - id: pyldraw-unvalidated-download-version-path
    languages:
      - python
    severity: ERROR
    paths:
      include:
        - /ldraw/downloads.py
    message: Validate the LDraw download version before using it as a path component.
    patterns:
      - pattern: cache_ldraw / version
      - pattern-not-inside: |
          def $FUNC(...):
              ...
              _validate_version(version)
              ...
              cache_ldraw / version

  - id: pyldraw-resume-validation-must-fail-closed
    languages:
      - python
    severity: ERROR
    paths:
      include:
        - /ldraw/downloads.py
    message: Accept resumed content only when the response validator explicitly matches.
    patterns:
      - pattern-inside: |
          def _resume_is_consistent(...):
              ...
      - pattern: _response_validator_matches(...) is False

  - id: pyldraw-renderer-shutdown-must-bound-communicate
    languages:
      - python
    severity: ERROR
    paths:
      include:
        - /ldraw/rendering.py
    message: Bound communicate() calls in renderer shutdown paths.
    patterns:
      - pattern-inside: |
          def _stop_renderer(...):
              ...
      - pattern: $PROCESS.communicate()

  - id: pyldraw-no-model-bom-module-import-cycle
    languages:
      - python
    severity: ERROR
    paths:
      include:
        - /ldraw/model.py
        - /ldraw/bom.py
    message: Keep ldraw.model and ldraw.bom decoupled at module import time.
    patterns:
      - pattern-regex: '^\s*(from\s+ldraw\.(bom|model)\s+import|import\s+ldraw\.(bom|model)\b)'
      - pattern-not-inside: |
          def $FUNC(...):
              ...
      - pattern-not-inside: |
          if TYPE_CHECKING:
              ...

  - id: pyldraw-no-parts-part-geometry-module-import-cycle
    languages:
      - python
    severity: ERROR
    paths:
      include:
        - /ldraw/parts.py
        - /ldraw/part_geometry.py
    message: Keep ldraw.parts and ldraw.part_geometry decoupled at module import time; use ldraw.part_geometry_types for shared value objects.
    patterns:
      - pattern-regex: '^\s*(from\s+ldraw\.(parts|part_geometry)\s+import|import\s+ldraw\.(parts|part_geometry)\b)'
      - pattern-not-inside: |
          def $FUNC(...):
              ...
      - pattern-not-inside: |
          if TYPE_CHECKING:
              ...

  - id: pyldraw-default-suffix-comparison-must-normalize-case
    languages:
      - python
    severity: WARNING
    paths:
      include:
        - /ldraw/pieces.py
    message: Normalize suffix case before comparing it with DEFAULT_SUFFIX.
    pattern-either:
      - pattern: suffix == DEFAULT_SUFFIX
      - pattern: DEFAULT_SUFFIX == suffix

  - id: pyldraw-import-config-must-use-generation-snapshot
    languages:
      - python
    severity: ERROR
    paths:
      include:
        - /ldraw/imports.py
    message: Read the default import configuration only through _config_snapshot().
    patterns:
      - pattern: $OWNER._default_config
      - pattern-not-inside: |
          def _config_snapshot(...):
              ...
      - pattern-not-inside: |
          def clean(...):
              ...

  - id: pyldraw-thread-joins-must-share-a-deadline
    languages:
      - python
    severity: WARNING
    paths:
      include:
        - /tests/**
    message: Use one monotonic deadline when joining multiple worker threads.
    patterns:
      - pattern-inside: |
          for $THREAD in $THREADS:
              ...
      - pattern: $THREAD.join(timeout=$TIMEOUT)
      - metavariable-regex:
          metavariable: $TIMEOUT
          regex: '^\d+(?:\.\d+)?$'
