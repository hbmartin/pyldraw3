# The paths.include entries are root-anchored (leading slash), so the
# intentionally-unsafe fixtures under tests/semgrep/ never match the
# enforcing scan; CI exercises them separately via `semgrep scan --test`.
rules:
  - id: pyldraw-unsafe-archive-extractall
    languages:
      - python
    severity: ERROR
    paths:
      include:
        - /ldraw/downloads.py
    message: Validate archive member paths before calling extractall().
    patterns:
      - pattern: $ARCHIVE.extractall(...)
      - pattern-not-inside: |
          _validate_zip_members($ARCHIVE, ...)
          ...
          $ARCHIVE.extractall(...)

  - id: pyldraw-unvalidated-download-version-path
    languages:
      - python
    severity: ERROR
    paths:
      include:
        - /ldraw/downloads.py
    message: Validate the LDraw download version before using it as a path component.
    patterns:
      - pattern: cache_ldraw / version
      - pattern-not-inside: |
          def $FUNC(...):
              ...
              _validate_version(version)
              ...
              cache_ldraw / version

  - id: pyldraw-resume-validation-must-fail-closed
    languages:
      - python
    severity: ERROR
    paths:
      include:
        - /ldraw/downloads.py
    message: Accept resumed content only when the response validator explicitly matches.
    patterns:
      - pattern-inside: |
          def _resume_is_consistent(...):
              ...
      - pattern-either:
          - pattern: _response_validator_matches(...) is False
          - pattern: _response_validator_matches(...) is not False
          - pattern: _response_validator_matches(...) == False
          - pattern: _response_validator_matches(...) != False
          - patterns:
              - pattern-inside: |
                  $MATCHED = _response_validator_matches(...)
                  ...
              - pattern-either:
                  - pattern: $MATCHED is False
                  - pattern: $MATCHED is not False
                  - pattern: $MATCHED == False
                  - pattern: $MATCHED != False

  - id: pyldraw-renderer-shutdown-must-bound-communicate
    languages:
      - python
    severity: ERROR
    paths:
      include:
        - /ldraw/rendering.py
    message: Bound communicate() calls in renderer shutdown paths.
    patterns:
      - pattern-inside: |
          def $SHUTDOWN_HELPER(...):
              ...
      - metavariable-regex:
          metavariable: $SHUTDOWN_HELPER
          regex: ^_(stop|drain_forced)_renderer$
      - pattern-either:
          - patterns:
              - pattern: $PROCESS.communicate(...)
              - pattern-not: $PROCESS.communicate(..., timeout=$TIMEOUT, ...)
          - pattern: $PROCESS.communicate(..., timeout=None, ...)

  - id: pyldraw-preview-cache-prune-requires-process-claim
    languages:
      - python
    severity: WARNING
    paths:
      include:
        - /ldraw/rendering.py
    message: Guard preview-cache pruning with the cross-process cache claim.
    patterns:
      - pattern-inside: |
          def _maybe_prune_preview_cache(...):
              ...
      - pattern: _prune_preview_cache($CACHE_ROOT, ...)
      - pattern-not-inside: |
          with _preview_cache_prune_claim($CACHE_ROOT) as $CLAIMED:
              ...
              if not $CLAIMED:
                  return
              ...
              _prune_preview_cache($CACHE_ROOT, ...)
      - pattern-not-inside: |
          with _preview_cache_prune_claim($CACHE_ROOT) as $CLAIMED:
              ...
              if $CLAIMED:
                  ...
                  _prune_preview_cache($CACHE_ROOT, ...)

  - id: pyldraw-no-model-bom-module-import-cycle
    languages:
      - python
    severity: ERROR
    paths:
      include:
        - /ldraw/model.py
        - /ldraw/bom.py
    message: Keep ldraw.model and ldraw.bom decoupled at module import time.
    patterns:
      - pattern-regex: '^\s*(from\s+ldraw\.(bom|model)\s+import|import\s+ldraw\.(bom|model)\b)'
      - pattern-not-inside: |
          def $FUNC(...):
              ...
      - pattern-not-inside: |
          if TYPE_CHECKING:
              ...

  - id: pyldraw-no-parts-part-geometry-module-import-cycle
    languages:
      - python
    severity: ERROR
    paths:
      include:
        - /ldraw/parts.py
        - /ldraw/part_geometry.py
    message: Keep ldraw.parts and ldraw.part_geometry decoupled at module import time; use ldraw.part_geometry_types for shared value objects.
    patterns:
      - pattern-regex: '^\s*(from\s+ldraw\.(parts|part_geometry)\s+import|import\s+ldraw\.(parts|part_geometry)\b)'
      - pattern-not-inside: |
          def $FUNC(...):
              ...
      - pattern-not-inside: |
          if TYPE_CHECKING:
              ...

  - id: pyldraw-default-suffix-comparison-must-normalize-case
    languages:
      - python
    severity: WARNING
    paths:
      include:
        - /ldraw/pieces.py
    message: Normalize suffix case before comparing it with DEFAULT_SUFFIX.
    pattern-either:
      - pattern: suffix == DEFAULT_SUFFIX
      - pattern: DEFAULT_SUFFIX == suffix

  - id: pyldraw-import-config-must-use-generation-snapshot
    languages:
      - python
    severity: ERROR
    paths:
      include:
        - /ldraw/imports.py
    message: Read the default import configuration only through _config_snapshot().
    patterns:
      - pattern: $OWNER._default_config
      - pattern-not-inside: |
          def _config_snapshot(...):
              ...
      - pattern-not-inside: |
          def clean(...):
              ...

  - id: pyldraw-thread-joins-must-share-a-deadline
    languages:
      - python
    severity: WARNING
    paths:
      include:
        - /tests/**
    message: Use one monotonic deadline when joining multiple worker threads.
    patterns:
      - pattern-inside: |
          for $THREAD in $THREADS:
              ...
      - pattern: $THREAD.join(timeout=$TIMEOUT)
      - metavariable-regex:
          metavariable: $TIMEOUT
          regex: '^\d+(?:\.\d+)?$'
