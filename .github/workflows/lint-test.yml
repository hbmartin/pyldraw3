name: Lint and Test
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
    - name: Create uv environment
      run: uv venv
    - name: Install dependencies
      run: uv sync --all-groups --locked
    - run: uv run ruff check .
      if: matrix.python-version == '3.12'
    - run: uv run ruff format --check .
      if: matrix.python-version == '3.12'
    - name: Run type checks
      if: matrix.python-version == '3.12'
      # tests/ is excluded: dynamic ldraw.library.* imports and test-double
      # attribute assignments are unresolvable statically (ty: 16, pyrefly: 4
      # pre-existing diagnostics as of 2026-07).
      run: |
        uv run ty check --python-version 3.12 ldraw
        uv run pyrefly check --python-version 3.12 ldraw
    - name: Run complexity checks
      if: matrix.python-version == '3.12'
      run: |
        uv run lizard --languages python ldraw tests
        uv run python scripts/check_function_budget.py
    - name: Run package metadata checks
      if: matrix.python-version == '3.12'
      run: uv run pyroma --min 10 .
    - name: Run package metadata checks (pyroma621)
      id: package-metadata
      shell: bash
      timeout-minutes: 5
      # Keep new rules advisory during evaluation; do not enable --strict.
      run: uv run --locked pyroma --min 10 --format json . | tee pyroma621-report.json
    - name: Upload package metadata report
      if: always() && steps.package-metadata.outcome != 'skipped'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pyroma621-report-python-${{ matrix.python-version }}
        path: pyroma621-report.json
        retention-days: 30
    - run: uv run deptry .
      if: matrix.python-version == '3.12'
    - name: Run tests with coverage
      if: matrix.python-version == '3.12'
      run: uv run pytest --cov=ldraw --cov-config=pyproject.toml --cov-report=lcov --cov-report=html
    - name: Run tests
      if: matrix.python-version != '3.12'
      run: uv run pytest
    - name: Upload coverage reports to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload coverage report as artifact
      if: always() && matrix.python-version == '3.12'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-report-python-${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 30
