name: Lint and Test
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
    - name: Create uv environment
      run: uv venv
    - name: Install dependencies
      run: uv sync --all-groups --locked
    - run: uv run ruff check .
    - run: uv run ruff format --check .
    - name: Run type checks
      # tests/ is excluded: dynamic ldraw.library.* imports and test-double
      # attribute assignments are unresolvable statically (ty: 16, pyrefly: 4
      # pre-existing diagnostics as of 2026-07).
      run: |
        uv run ty check ldraw
        uv run pyrefly check ldraw
    - name: Run complexity checks
      run: uv run lizard --languages python ldraw tests
    - name: Run package metadata checks
      run: uv run pyroma --min 10 .
    - run: uv run deptry .
    - name: Run tests with coverage
      run: uv run pytest --cov=ldraw --cov-report=lcov --cov-report=html
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Upload coverage report as artifact
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-report-python-${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 30
