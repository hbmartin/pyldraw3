name: Integration Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

permissions: {}

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        ldraw-version: ["2018-02", "complete"]
      fail-fast: false
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
    
    - name: Create uv environment
      run: uv venv
    
    - name: Install dependencies
      run: uv sync --all-groups --locked
    
    - name: Download LDraw library (${{ matrix.ldraw-version }})
      run: |
        if [ "${{ matrix.ldraw-version }}" = "complete" ]; then
          uv run ldraw download --yes
        else
          uv run ldraw download --version ${{ matrix.ldraw-version }} --yes
        fi
      timeout-minutes: 30
    
    - name: Generate library modules
      run: uv run ldraw generate --yes
      timeout-minutes: 15
    
    - name: Run integration tests
      run: uv run pytest --integration -v --tb=short --durations=10
      timeout-minutes: 45
    
    - name: Test CLI commands
      run: |
        # Test basic CLI functionality
        uv run ldraw --help
        uv run ldraw config
        uv run ldraw version
      timeout-minutes: 5
    
    - name: Test example scripts
      run: |
        cd examples
        # A hang fails the step via timeout's exit 124; LDraw stdout is
        # discarded to keep the log readable, stderr still shows failures.
        timeout 60 uv run python stairs.py > /dev/null
        timeout 60 uv run python figure.py > /dev/null
      timeout-minutes: 10
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: integration-test-results-py${{ matrix.python-version }}-${{ matrix.ldraw-version }}
        path: |
          *.log
          test-results.xml
        retention-days: 30
