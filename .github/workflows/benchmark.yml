name: Performance Benchmarks

on:
  push:
    branches: main
  pull_request:
    branches: main

permissions: {}

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      # github-action-benchmark pushes gh-pages history on main and posts
      # commit comments on alerts; both fall under the contents scope.
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Need full history for performance comparison

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Create uv environment
      run: uv venv

    - name: Install dependencies
      run: |
        uv sync --all-groups --locked

    - name: Run benchmarks
      run: |
        uv run pytest benchmarks/ --benchmark-json=benchmark-results.json --benchmark-only

    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      if: github.ref == 'refs/heads/main'
      with:
        tool: 'pytest'
        output-file-path: benchmark-results.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        comment-on-alert: true
        alert-threshold: '150%'
        # PRs hard-fail on regressions (see the PR step); on main we only
        # comment, since the regressing change has already merged.
        fail-on-alert: false

    - name: Store benchmark result (PR)
      uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
      if: github.event_name == 'pull_request'
      with:
        tool: 'pytest'
        output-file-path: benchmark-results.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: false
        comment-on-alert: true
        alert-threshold: '150%'
        fail-on-alert: true

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: benchmark-results
        path: benchmark-results.json
        retention-days: 30

  memory-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Create uv environment
      run: uv venv

    - name: Install dependencies
      run: |
        uv sync --all-groups --locked

    - name: Run memory profiling
      run: |
        uv run python -m memory_profiler benchmarks/memory_profile.py > memory-profile.txt
      continue-on-error: true

    - name: Upload memory profile
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: memory-profile
        path: memory-profile.txt
        retention-days: 30
