[project]
site_name = "pyldraw3"
site_url = "https://hbmartin.github.io/pyldraw3/"
site_description = "Python package for creating and manipulating LDraw format files."
site_author = "Harold Martin"
copyright = "Copyright &copy; 2008 David Boddie, 2021 Matthieu Berthome, 2025 Harold Martin"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/hbmartin/pyldraw3"
repo_name = "hbmartin/pyldraw3"
edit_uri = "edit/main/docs/"
nav = [
    { "Home" = "index.md" },
    { "Guide" = "guide.md" },
    { "Examples" = "examples.md" },
    { "LEGO Model Builder" = "lego-model-builder.md" },
    { "Visual Comparison" = "visual-comparison.md" },
    { "CLI Reference" = "cli.md" },
    { "API Reference" = "api/index.md" },
    { "Library Imports" = "dynamic-imports.md" },
    { "Upgrading to 1.1" = "upgrading-1.1.md" },
    { "Upgrading to 1.2" = "upgrading-1.2.md" },
    { "Upgrading to 1.3" = "upgrading-1.3.md" },
    { "Upgrading to 1.4" = "upgrading-1.4.md" },
    { "Upgrading to 1.5" = "upgrading-1.5.md" },
    { "GitHub" = "https://github.com/hbmartin/pyldraw3" },
    { "Contributing" = "https://github.com/hbmartin/pyldraw3/blob/main/CONTRIBUTING.md" },
]

[project.theme]
features = [
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "navigation.indexes",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.plugins.macros]
module_name = "docs_api_reference"
on_error_fail = true

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
filters = ["!^_"]
heading_level = 2
inherited_members = true
members_order = "source"
separate_signature = true
show_if_no_docstring = true
show_root_full_path = false
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
